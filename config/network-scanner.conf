# network-scanner configuration (KEY=VALUE, read by both the bash and the
# PowerShell tools). Command-line options always win over this file.
# Use it with:  ./scan-network.sh -c config/network-scanner.conf -t 192.168.1.0/24
#               .\scan-network.ps1 -ConfigPath config\network-scanner.conf -Target 192.168.1.0/24

# ---- logging ---------------------------------------------------------------
LOG_LEVEL=INFO                 # DEBUG | INFO | WARN | ERROR
LOG_FILE=                      # e.g. logs/network-scanner.log (empty = console only)

# ---- scan-network ----------------------------------------------------------
PORTS=21,22,23,25,53,80,110,111,135,139,143,443,445,993,995,1723,3306,3389,5900,8080
JOBS=64                        # parallel probes (1-256)
TIMEOUT=1                      # seconds per probe (bash); PowerShell uses TIMEOUT*1000 ms
METHODS=icmp,tcp,arp           # discovery methods to use
TCP_DISCOVERY_PORTS=80,443,22,445,139,3389
OUI_FILE=data/oui-subset.csv   # swap in a full IEEE oui list if you have one
RESOLVE_NETBIOS=1              # nmblookup / nbtstat when available
RESOLVE_MDNS=1                 # avahi-resolve when available (bash only)

# ---- arp-spoof-detector ----------------------------------------------------
ARP_BASELINE=arp-baseline.txt  # created with --init / -InitBaseline
ARP_INTERVAL=30                # seconds between checks in watch mode

# ---- dns-analyzer ----------------------------------------------------------
DNS_RESOLVERS=1.1.1.1,8.8.8.8,9.9.9.9
DNS_DOMAINS_FILE=data/dns-check-domains.txt
